name: GitHub Profile 3D Contribution Calendar

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "assets/nova-orbit.svg"
      - ".github/workflows/profile-3d.yml"
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D contribution calendar
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit generated calendar
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if ! git diff --cached --quiet; then
            git commit -m "chore: update 3D contribution calendar"
            git push
          fi
